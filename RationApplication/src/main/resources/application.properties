spring.application.name=RationApplication
server.port = 8081

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database = RationApplicationDB
spring.data.mongodb.auto-index-creation =  true

# JWT Configuration
app.jwt.secret=your-super-secret-jwt-key-change-this-in-production-minimum-256-bits-secret-key
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Logging
logging.level.root=INFO
logging.level.com.rationApplication=DEBUG

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:8081
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# QR Code Configuration
app.qr.size=300
app.qr.margin=2

# Transaction Configuration
app.transaction.sync-interval=300000